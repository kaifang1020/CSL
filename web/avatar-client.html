<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClinicalSkillsLab — Jordan (AvatarForcing)</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin:0; background:#0e0e10; color:#eee; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 18px; }
  h2 { margin: 6px 0 12px; }
  .stage { display:flex; gap:14px; flex-wrap:wrap; }
  .col { flex:1; min-width:300px; }
  .label { font-size:12px; color:#9a9; margin:4px 0; letter-spacing:.06em; }
  video { width:100%; background:#000; border-radius:12px; aspect-ratio:1/1; object-fit:cover; }
  #selfVideo { aspect-ratio:4/3; }
  .row { display:flex; gap:10px; margin:14px 0; align-items:center; flex-wrap:wrap; }
  button { padding:11px 20px; border:0; border-radius:9px; font-size:15px; cursor:pointer; font-weight:600; }
  #connectBtn { background:#2ecc71; color:#062; }
  #disconnectBtn { background:#e74c3c; color:#fff; }
  label.tog { font-size:14px; color:#cde; display:flex; gap:6px; align-items:center; }
  #status { font-size:13px; color:#7fb3ff; }
  #log { font-family: ui-monospace, monospace; font-size:12px; background:#000; padding:10px;
         border-radius:9px; height:160px; overflow:auto; white-space:pre-wrap; color:#9fe; margin-top:10px; }
  .ok { color:#5fe28a; } .bad { color:#ff8a8a; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Jordan — 模拟来访者 (AvatarForcing)</h2>
  <div class="stage">
    <div class="col">
      <div class="label">JORDAN（AVATAR）</div>
      <video id="botVideo" autoplay playsinline></video>
      <audio id="botAudio" autoplay></audio>
    </div>
    <div class="col">
      <div class="label">你的摄像头（驱动 Jordan 的反应；隐私模式下可只本地显示、不发送）</div>
      <video id="selfVideo" autoplay playsinline muted></video>
    </div>
  </div>
  <div class="row">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn">Disconnect</button>
    <label class="tog"><input type="checkbox" id="camToggle" checked> 发送摄像头（驱动反应）</label>
    <span id="status">Idle</span>
  </div>
  <div id="log"></div>
</div>

<script type="module">
import { PipecatClient } from "https://esm.sh/@pipecat-ai/client-js";
import { DailyTransport } from "https://esm.sh/@pipecat-ai/daily-transport";

// 经 SSH 隧道指向 GPU 上的 bot：ssh -p 41393 -N -L 7860:localhost:7860 root@<ip>
const BOT_START_URL = "http://localhost:7860/start";
const $ = (id) => document.getElementById(id);
const log = (m, cls) => { const el=$("log"); const s=document.createElement("span");
  if (cls) s.className=cls; s.textContent=m+"\n"; el.appendChild(s); el.scrollTop=el.scrollHeight; console.log(m); };
const setStatus = (s) => { $("status").textContent = s; };

let client = null;

async function connect() {
  try {
    setStatus("connecting…");
    const useCam = $("camToggle").checked;
    log("creating client… enableCam=" + useCam);
    client = new PipecatClient({
      transport: new DailyTransport(),
      enableMic: true,
      enableCam: useCam,                 // ★ 关键：true 才会把摄像头真正发布到房间（之前一直是 false）
      callbacks: {
        onConnected: () => log("✅ connected", "ok"),
        onDisconnected: () => { log("disconnected"); setStatus("disconnected"); },
        onBotReady: () => log("🤖 Jordan ready"),
        onBotStartedSpeaking: () => log("🗣️ Jordan speaking"),
        onTrackStarted: (track, p) => {
          if (p?.local) {                                  // 自己的摄像头本地预览
            if (track.kind === "video") {
              $("selfVideo").srcObject = new MediaStream([track]);
              log("📷 本地摄像头已发布（正在驱动 Jordan）", "ok");
            }
            return;
          }
          if (track.kind === "video") {                    // Jordan 的 avatar 视频
            $("botVideo").srcObject = new MediaStream([track]);
            $("botVideo").play?.().catch(()=>{});
            log("🎉 收到 Jordan 视频轨道", "ok");
          } else if (track.kind === "audio") {             // Jordan 的语音
            $("botAudio").srcObject = new MediaStream([track]);
          }
        },
        onError: (e) => log("❌ " + JSON.stringify(e?.data ?? e), "bad"),
      },
    });
    const requestData = { createDailyRoom: true };
    if (typeof client.startBotAndConnect === "function") {
      await client.startBotAndConnect({ endpoint: BOT_START_URL, requestData });
    } else {
      await client.connect({ endpoint: BOT_START_URL, requestData });
    }
    setStatus("connected" + (useCam ? " · 摄像头已开" : " · 仅语音"));
  } catch (e) {
    setStatus("failed");
    log("❌ " + (e?.message || JSON.stringify(e)), "bad");
  }
}

async function disconnect() {
  try { await client?.disconnect(); } catch (e) { log("disconnect err: " + e); }
  client = null;
  setStatus("disconnected");
  $("botVideo").srcObject = null;
  $("selfVideo").srcObject = null;
}

$("connectBtn").onclick = connect;
$("disconnectBtn").onclick = disconnect;
</script>
</body>
</html>
